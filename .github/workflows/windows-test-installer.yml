name: Windows test installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --test-reporter=spec
      - name: Build Windows installer
        run: npm run dist:test
      - uses: actions/upload-artifact@v4
        with:
          name: commburn-windows-test-installer-${{ github.run_number }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
