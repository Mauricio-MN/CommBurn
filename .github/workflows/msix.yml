name: Build MSIX

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão em package.json, sem o prefixo v (por exemplo, 0.1.2)"
        required: true
        type: string
      channel:
        description: "store: publisher da Partner Center, para envio à loja (sem assinatura local). local: CN=CMBRN - Software, assinado com certificado autoassinado gerado no CI"
        required: true
        type: choice
        options:
          - store
          - local
        default: store

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF_NAME -ne "main") {
            Write-Error "Run this workflow from the main branch"
            exit 1
          }
          $packageVersion = node -p "require('./package.json').version"
          if ($env:RELEASE_VERSION -ne $packageVersion) {
            Write-Error "Input version $env:RELEASE_VERSION must match package.json version $packageVersion"
            exit 1
          }
      - run: npm ci
      - run: npm test
      - run: npm run dist:msix
        env:
          MSIX_CHANNEL: ${{ inputs.channel }}
      - name: Sign local MSIX with self-signed certificate
        if: inputs.channel == 'local'
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=CMBRN - Software" `
            -KeyUsage DigitalSignature -KeySpec Signature -KeyExportPolicy Exportable `
            -FriendlyName "CommBurn local" -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          $password = [guid]::NewGuid().ToString()
          $securePassword = ConvertTo-SecureString -String $password -Force -AsPlainText
          $pfx = Join-Path $env:RUNNER_TEMP "commburn-local.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $securePassword | Out-Null
          Export-Certificate -Cert $cert -FilePath "dist/commburn-local.cer" | Out-Null
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          $msix = Get-ChildItem dist -Filter *.msix | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $password $msix.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item $pfx -Force
      - uses: actions/upload-artifact@v4
        with:
          name: commburn-msix-v${{ inputs.version }}-${{ inputs.channel }}
          path: |
            dist/*.msix
            dist/*.cer
          if-no-files-found: error
          retention-days: 90
