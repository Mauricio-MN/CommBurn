name: Build MSIX

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão em package.json, sem o prefixo v (por exemplo, 0.1.2)"
        required: true
        type: string
      channel:
        description: "store: publisher da Partner Center, para envio à loja. local: publisher CN=CMBRN - Software, para assinatura local"
        required: true
        type: choice
        options:
          - store
          - local
        default: store

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF_NAME -ne "main") {
            Write-Error "Run this workflow from the main branch"
            exit 1
          }
          $packageVersion = node -p "require('./package.json').version"
          if ($env:RELEASE_VERSION -ne $packageVersion) {
            Write-Error "Input version $env:RELEASE_VERSION must match package.json version $packageVersion"
            exit 1
          }
      - run: npm ci
      - run: npm test
      - run: npm run dist:msix
        env:
          MSIX_CHANNEL: ${{ inputs.channel }}
      - uses: actions/upload-artifact@v4
        with:
          name: commburn-msix-v${{ inputs.version }}-${{ inputs.channel }}
          path: dist/*.msix
          if-no-files-found: error
          retention-days: 90
