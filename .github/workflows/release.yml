name: Desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require tag to match package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG must match package version v$PACKAGE_VERSION"
            exit 1
          fi

  package:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        if: matrix.artifact == 'linux'
        with:
          name: commburn-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.artifact == 'windows'
        with:
          name: commburn-windows
          path: |
            dist/*.msi
            dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.artifact == 'macos'
        with:
          name: commburn-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --title "CommBurn $GITHUB_REF_NAME" --generate-notes