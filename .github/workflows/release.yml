name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão em package.json, sem o prefixo v (por exemplo, 0.1.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require tag to match package version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Run this workflow from the main branch"
            exit 1
          fi
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Input version $RELEASE_VERSION must match package.json version $PACKAGE_VERSION"
            exit 1
          fi
          if ! printf '%s' "$RELEASE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version must use semantic version format, for example 0.1.2"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "::error::Release tag v$RELEASE_VERSION already exists"
            exit 1
          fi

  package:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        if: matrix.artifact == 'linux'
        with:
          name: commburn-linux-v${{ inputs.version }}
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.artifact == 'windows'
        with:
          name: commburn-windows-v${{ inputs.version }}
          path: |
            dist/*.msi
            dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.artifact == 'macos'
        with:
          name: commburn-macos-v${{ inputs.version }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" release/* --target "$GITHUB_SHA" --title "CommBurn v$RELEASE_VERSION" --generate-notes