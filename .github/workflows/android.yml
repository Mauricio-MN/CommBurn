name: Build Android test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - name: Generate web assets and Android project
        run: |
          npm run build:www
          npx cap add android
          cp -r build/android/res/. android/app/src/main/res/
          npm run build:android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Name APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/CommBurn-${VERSION}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: commburn-android-debug
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
